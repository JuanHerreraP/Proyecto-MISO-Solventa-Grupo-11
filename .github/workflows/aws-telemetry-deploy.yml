name: AWS Telemetry Deploy

# Despliegue automático de la solución completa (backend, web, KYC, telemetría, RDS, Redis, colas
# SQS/DLQ y workers del EC04) en UNA CUENTA AWS DISTINTA a la del resto del equipo, disparado por
# push a la rama feature/aws-telemetry-provider. Aprovisiona desde cero si el stack no existe o lo
# actualiza si ya existe. Reutiliza las mismas plantillas (infra/aws/ecr.json e infra/aws/stack.json).
#
# No toca el workflow "AWS Infra" ni los secretos del ambiente del compañero: usa exclusivamente los
# secretos con sufijo _TELEMETRIA (credenciales de MI cuenta) más SOLVENTA_TELEMETRY_API_KEY y
# TELEMETRY_MOCK_PASSWORD.
#
# Secrets del repositorio usados por este workflow (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID_TELEMETRIA, AWS_SECRET_ACCESS_KEY_TELEMETRIA  (de MI cuenta AWS)
#   AWS_SESSION_TOKEN_TELEMETRIA   (opcional, si las credenciales son temporales)
#   PAGOS_WEBHOOK_SECRET_TELEMETRIA  (>= 32 caracteres; lo exige el backend)
#   ADMIN_PASSWORD_TELEMETRIA        (opcional; si está, se crea el usuario administrador)
#   SOLVENTA_TELEMETRY_API_KEY       (opcional; si falta, se genera y se conserva)
#   TELEMETRY_MOCK_PASSWORD          (opcional; si falta, se genera y se conserva)

on:
  push:
    branches:
      - feature/aws-telemetry-provider

# Serializa cualquier operación de este workflow sobre el stack para no desplegar dos veces a la
# vez. No se cancela a mitad: un despliegue en curso no debe interrumpirse.
concurrency:
  group: aws-telemetry-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  STACK: solventa-mvp
  ECR_STACK: solventa-ecr
  JWT_SECRET_NAME: solventa-mvp-jwt
  APP_SECRETS_NAME: solventa-mvp-app
  ADMIN_EMAIL: manager@solventa.local
  ADMIN_ROL: SERVICIO_INTERNO

jobs:
  desplegar:
    name: Desplegar solución completa en mi cuenta AWS
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # 1. Checkout del commit exacto publicado en la rama (lo hace actions/checkout por defecto).
      - uses: actions/checkout@v4

      # 2. Validaciones antes de tocar AWS: lint, pruebas (incluye KYC y EC04) y la plantilla de
      #    CloudFormation. Las pruebas no generan desembolsos reales (usan dobles en memoria).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependencias de validación
        run: |
          pip install -r backend/requirements-dev.txt
          pip install cfn-lint==1.57.2

      - name: Ruff (formato y lint)
        working-directory: backend
        run: |
          ruff format --check .
          ruff check .

      - name: Pruebas del backend (incluye KYC y EC04)
        working-directory: backend
        run: pytest

      - name: Validar las plantillas de CloudFormation
        run: cfn-lint --template infra/aws/stack.json infra/aws/ecr.json --regions us-east-1

      # 3. Autenticarse en MI cuenta AWS con los secretos _TELEMETRIA y confirmar la identidad.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_TELEMETRIA }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_TELEMETRIA }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN_TELEMETRIA }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar que es mi cuenta AWS
        run: |
          aws sts get-caller-identity
          CUENTA=$(aws sts get-caller-identity --query Account --output text)
          echo "Desplegando en la cuenta AWS: $CUENTA"
          echo "### Cuenta AWS del despliegue: $CUENTA" >> "$GITHUB_STEP_SUMMARY"

      # 4-5. ECR (se crea si no existe) y publicación de la imagen con el código de la rama.
      - name: Crear repositorio ECR
        run: |
          aws cloudformation deploy --stack-name "$ECR_STACK" \
            --template-file infra/aws/ecr.json --no-fail-on-empty-changeset
          BACKEND_REPO=$(aws cloudformation describe-stacks --stack-name "$ECR_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUri'].OutputValue" --output text)
          echo "BACKEND_REPO=$BACKEND_REPO" >> "$GITHUB_ENV"
          echo "REGISTRY=${BACKEND_REPO%%/*}" >> "$GITHUB_ENV"

      - name: Construir y subir la imagen con el código de la rama
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          docker build -t "$BACKEND_REPO:$IMAGE_TAG" backend
          docker push "$BACKEND_REPO:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      # 6a. Secreto con las llaves JWT (se crea una vez y se reutiliza).
      - name: Crear (o reutilizar) el secreto con las llaves JWT
        run: |
          if JWT_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$JWT_SECRET_NAME" \
              --query ARN --output text 2>/dev/null); then
            echo "El secreto $JWT_SECRET_NAME ya existe; se reutiliza."
          else
            mkdir -p infra/secrets
            chmod 700 infra/secrets
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out infra/secrets/private_key.pem
            openssl pkey -in infra/secrets/private_key.pem -pubout \
              -out infra/secrets/public_key.pem
            chmod 600 infra/secrets/*.pem
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('infra/secrets')
          (p / 'jwt.json').write_text(json.dumps({
              'private_key': (p / 'private_key.pem').read_text(),
              'public_key': (p / 'public_key.pem').read_text(),
          }))
          (p / 'jwt.json').chmod(0o600)
          PY
            JWT_SECRET_ARN=$(aws secretsmanager create-secret --name "$JWT_SECRET_NAME" \
              --secret-string file://infra/secrets/jwt.json --query ARN --output text)
            rm -rf infra/secrets
          fi
          echo "JWT_SECRET_ARN=$JWT_SECRET_ARN" >> "$GITHUB_ENV"

      # 6b. Secretos de la aplicación. Se parte del secreto actual (si existe) para conservar lo que
      #     ya tenga; las credenciales de telemetría se generan una sola vez y no cambian entre
      #     despliegues. Los valores nunca se imprimen en el log.
      - name: Guardar los secretos de la aplicación en Secrets Manager
        env:
          PAGOS_WEBHOOK_SECRET: ${{ secrets.PAGOS_WEBHOOK_SECRET_TELEMETRIA }}
          SOLVENTA_TELEMETRY_API_KEY: ${{ secrets.SOLVENTA_TELEMETRY_API_KEY }}
          TELEMETRY_MOCK_PASSWORD: ${{ secrets.TELEMETRY_MOCK_PASSWORD }}
        run: |
          if [ -z "$PAGOS_WEBHOOK_SECRET" ]; then
            echo "::error::Falta el secret PAGOS_WEBHOOK_SECRET_TELEMETRIA (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${#PAGOS_WEBHOOK_SECRET}" -lt 32 ]; then
            echo "::error::PAGOS_WEBHOOK_SECRET_TELEMETRIA debe tener al menos 32 caracteres."
            exit 1
          fi
          mkdir -p infra/secrets
          chmod 700 infra/secrets
          if EXISTENTE=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRETS_NAME" \
              --query SecretString --output text 2>/dev/null); then
            printf '%s' "$EXISTENTE" > infra/secrets/app.actual.json
          else
            echo '{}' > infra/secrets/app.actual.json
          fi
          chmod 600 infra/secrets/app.actual.json
          python3 - <<'PY'
          import json, os, secrets
          from pathlib import Path

          actual = json.loads(Path('infra/secrets/app.actual.json').read_text() or '{}')

          def resolver(clave, valor_github, generar=False):
              desde_github = (valor_github or '').strip()
              if desde_github:
                  return desde_github
              existente = (actual.get(clave) or '').strip()
              if existente:
                  return existente
              return secrets.token_urlsafe(32) if generar else ''

          datos = dict(actual)
          datos.update({
              'pagos_webhook_secret': os.environ['PAGOS_WEBHOOK_SECRET'],
              # Siempre presentes: ECS falla al iniciar si el secreto no trae la clave. Vacío = apagado.
              'fcm_credenciales_json': actual.get('fcm_credenciales_json', ''),
              'notificaciones_clave_interna': actual.get('notificaciones_clave_interna', ''),
              # HU20: credencial de servicio y contraseña Basic. Se generan si no existen todavía.
              'solventa_telemetry_api_key': resolver(
                  'solventa_telemetry_api_key',
                  os.environ.get('SOLVENTA_TELEMETRY_API_KEY'),
                  generar=True,
              ),
              'telemetry_mock_password': resolver(
                  'telemetry_mock_password',
                  os.environ.get('TELEMETRY_MOCK_PASSWORD'),
                  generar=True,
              ),
          })
          p = Path('infra/secrets/app.json')
          p.write_text(json.dumps(datos))
          p.chmod(0o600)
          PY
          rm -f infra/secrets/app.actual.json
          SECRETO_CAMBIO=false
          if APP_SECRETS_ARN=$(aws secretsmanager describe-secret --secret-id "$APP_SECRETS_NAME" \
              --query ARN --output text 2>/dev/null); then
            ACTUAL=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRETS_NAME" \
              --query SecretString --output text 2>/dev/null || echo "")
            if [ "$ACTUAL" = "$(cat infra/secrets/app.json)" ]; then
              echo "El secreto $APP_SECRETS_NAME ya está al día."
            else
              aws secretsmanager put-secret-value --secret-id "$APP_SECRETS_NAME" \
                --secret-string file://infra/secrets/app.json >/dev/null
              SECRETO_CAMBIO=true
              echo "El secreto $APP_SECRETS_NAME cambió; se reiniciarán los servicios."
            fi
          else
            APP_SECRETS_ARN=$(aws secretsmanager create-secret --name "$APP_SECRETS_NAME" \
              --secret-string file://infra/secrets/app.json --query ARN --output text)
            echo "Secreto $APP_SECRETS_NAME creado."
          fi
          echo "APP_SECRETS_ARN=$APP_SECRETS_ARN" >> "$GITHUB_ENV"
          echo "SECRETO_CAMBIO=$SECRETO_CAMBIO" >> "$GITHUB_ENV"

      # 7. Parámetros de CloudFormation (versión de PostgreSQL más reciente disponible en mi cuenta).
      - name: Generar parámetros de CloudFormation
        run: |
          DISPONIBLES=$(aws rds describe-orderable-db-instance-options --engine postgres \
            --db-instance-class db.t3.micro \
            --query 'OrderableDBInstanceOptions[].EngineVersion' --output text \
            | tr '\t' '\n' | sort -uV)
          echo "Versiones de PostgreSQL disponibles para db.t3.micro:" $DISPONIBLES
          POSTGRES_ENGINE_VERSION=$(printf '%s\n' "$DISPONIBLES" | grep -E '^16\.' | tail -1)
          if [ -z "$POSTGRES_ENGINE_VERSION" ]; then
            echo "::error::No hay una versión 16.x de PostgreSQL disponible para db.t3.micro en esta región."
            exit 1
          fi
          echo "Se usa PostgreSQL $POSTGRES_ENGINE_VERSION."
          export POSTGRES_ENGINE_VERSION
          mkdir -p infra/secrets
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          values = {
              'BackendImage': os.environ['BACKEND_REPO'] + ':' + os.environ['IMAGE_TAG'],
              'JwtSecretArn': os.environ['JWT_SECRET_ARN'],
              'AppSecretsArn': os.environ['APP_SECRETS_ARN'],
              'PostgresEngineVersion': os.environ['POSTGRES_ENGINE_VERSION'],
          }
          # Sin PublicUrl: el stack usa el dominio de CloudFront que él mismo crea en MI cuenta.
          p = Path('infra/secrets/parameters.json')
          p.write_text(json.dumps([{'ParameterKey': k, 'ParameterValue': v} for k, v in values.items()]))
          p.chmod(0o600)
          PY

      - name: Limpiar stack en ROLLBACK_COMPLETE (si existe)
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          echo "Estado actual del stack: $STATUS"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi

      - name: Preparar y validar la plantilla minificada
        run: |
          mkdir -p infra/secrets
          python3 -c "import json; json.dump(json.load(open('infra/aws/stack.json')), open('infra/secrets/stack.min.json', 'w'), separators=(',', ':'))"
          TAMANO=$(wc -c < infra/secrets/stack.min.json)
          echo "Plantilla minificada: $TAMANO bytes (máximo 51200)."
          if [ "$TAMANO" -gt 51200 ]; then
            echo "::error::La plantilla supera el máximo de 51200 bytes; hay que subirla a S3 o dividir el stack."
            exit 1
          fi
          aws cloudformation validate-template --template-body "file://infra/secrets/stack.min.json" >/dev/null

      # 8. Revisión del changeset: si el stack ya existe, se verifica que ningún recurso persistente
      #    (RDS, Redis, SQS, S3, CloudFront, secretos, ECR) vaya a ser reemplazado o eliminado. En
      #    la primera creación no hay nada que reemplazar.
      - name: Revisar el changeset (sin operaciones destructivas)
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          if [ "$STATUS" = "NONE" ]; then
            echo "El stack no existe todavía: se creará desde cero, sin reemplazos que revisar."
            exit 0
          fi
          CS="telemetry-$(date -u +%Y%m%d%H%M%S)"
          echo "CS_NAME=$CS" >> "$GITHUB_ENV"
          TIPO=UPDATE
          if [ "$STATUS" = "REVIEW_IN_PROGRESS" ]; then TIPO=CREATE; fi
          aws cloudformation create-change-set --stack-name "$STACK" --change-set-name "$CS" \
            --change-set-type "$TIPO" \
            --template-body "file://infra/secrets/stack.min.json" \
            --parameters "file://infra/secrets/parameters.json" \
            --capabilities CAPABILITY_IAM >/dev/null
          if ! aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK" --change-set-name "$CS" 2>/dev/null; then
            RAZON=$(aws cloudformation describe-change-set --stack-name "$STACK" \
              --change-set-name "$CS" --query "StatusReason" --output text 2>/dev/null || echo "")
            echo "El changeset no produjo cambios o falló su creación: $RAZON"
            aws cloudformation delete-change-set --stack-name "$STACK" --change-set-name "$CS" 2>/dev/null || true
            echo "CS_NAME=" >> "$GITHUB_ENV"
            exit 0
          fi
          PERSISTENTES="AWS::RDS::DBInstance AWS::ElastiCache::ReplicationGroup AWS::SQS::Queue AWS::S3::Bucket AWS::CloudFront::Distribution AWS::SecretsManager::Secret AWS::ECR::Repository"
          aws cloudformation describe-change-set --stack-name "$STACK" --change-set-name "$CS" \
            --query "Changes[].ResourceChange.{Action:Action,Type:ResourceType,Id:LogicalResourceId,Replace:Replacement}" \
            --output json > infra/secrets/changeset.json
          PERSISTENTES="$PERSISTENTES" python3 - <<'PY'
          import json, os
          persistentes = set(os.environ["PERSISTENTES"].split())
          cambios = json.load(open("infra/secrets/changeset.json"))
          problemas = []
          for c in cambios:
              if c["Type"] not in persistentes:
                  continue
              if c["Action"] == "Remove" or c.get("Replace") in ("True", "Conditional"):
                  problemas.append(
                      "{} ({}): Action={} Replacement={}".format(
                          c["Id"], c["Type"], c["Action"], c.get("Replace")
                      )
                  )
          if problemas:
              print("::error::El changeset reemplaza o elimina recursos persistentes:")
              for p in problemas:
                  print("::error::  - " + p)
              raise SystemExit(1)
          print("El changeset no reemplaza ni elimina recursos persistentes.")
          PY
          rm -f infra/secrets/changeset.json

      - name: Limpiar el changeset de revisión
        if: ${{ always() && env.CS_NAME != '' }}
        run: |
          aws cloudformation delete-change-set --stack-name "$STACK" \
            --change-set-name "$CS_NAME" 2>/dev/null || true

      # 6-7. Aplicar: crea desde cero (backend, web, KYC, telemetría, RDS, Redis, SQS/DLQ, workers
      #      del EC04, SNS, autoescalado) o actualiza el stack existente en MI cuenta.
      - name: Desplegar el stack
        run: |
          aws cloudformation deploy --stack-name "$STACK" \
            --template-file infra/secrets/stack.min.json \
            --parameter-overrides file://infra/secrets/parameters.json \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs" --output table

      - name: Mostrar por qué falló el stack
        if: ${{ failure() }}
        run: |
          aws cloudformation describe-stack-events --stack-name "$STACK" \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table || true

      # ECS lee los secretos solo al iniciar: si el valor cambió, se fuerza un nuevo despliegue.
      - name: Reiniciar los servicios para tomar el secreto nuevo
        if: ${{ env.SECRETO_CAMBIO == 'true' }}
        run: |
          CLUSTER=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='Cluster'].OutputValue" --output text)
          SERVICIOS=""
          for SALIDA in Service WorkerService PagosWorkerService; do
            NOMBRE=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$SALIDA'].OutputValue" --output text)
            if [ -z "$NOMBRE" ] || [ "$NOMBRE" = "None" ]; then continue; fi
            aws ecs update-service --cluster "$CLUSTER" --service "$NOMBRE" \
              --force-new-deployment >/dev/null
            SERVICIOS="$SERVICIOS $NOMBRE"
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICIOS

      # 8. Esperar a que todos los servicios ECS queden estables antes de validar.
      - name: Esperar a que los servicios ECS estén estables
        run: |
          SALIDAS() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          CLUSTER=$(SALIDAS Cluster)
          SERVICIOS=""
          for SALIDA in Service WorkerService PagosWorkerService; do
            NOMBRE=$(SALIDAS "$SALIDA")
            if [ -z "$NOMBRE" ] || [ "$NOMBRE" = "None" ]; then continue; fi
            SERVICIOS="$SERVICIOS $NOMBRE"
          done
          echo "Esperando estabilidad de:$SERVICIOS"
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICIOS

      # Compilar y publicar el frontend en el bucket web de MI cuenta.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compilar y publicar la web
        run: |
          WEB_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucket'].OutputValue" --output text)
          (cd web && npm ci && VITE_API_URL="" npm run build)
          aws s3 sync web/dist/ "s3://$WEB_BUCKET/" --cache-control no-cache

      # 9-10. Validar el backend principal y el proveedor de telemetría (incluido su Swagger),
      #       tomando SIEMPRE la URL de CloudFront de las salidas del stack de MI cuenta.
      - name: Verificar backend y proveedor de telemetría
        run: |
          MVP_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          MVP_URL="${MVP_URL%/}"
          echo "URL de CloudFront (mi cuenta): $MVP_URL"
          # Backend principal.
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors "$MVP_URL/salud"
          curl --fail "$MVP_URL/openapi.json" -o /dev/null -w "backend openapi: %{http_code}\n"
          # Proveedor de telemetría tras el proxy. La contraseña Basic sale de Secrets Manager.
          TEL_USUARIO=telemetry
          TEL_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRETS_NAME" \
            --query SecretString --output text | python3 -c 'import json,sys;print(json.load(sys.stdin).get("telemetry_mock_password",""))')
          TEL_BASE="$MVP_URL/api/telemetry"
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors \
            -u "$TEL_USUARIO:$TEL_PASSWORD" "$TEL_BASE/health" -o /dev/null -w "telemetry health: %{http_code}\n"
          curl --fail -u "$TEL_USUARIO:$TEL_PASSWORD" "$TEL_BASE/openapi.json" \
            -o /dev/null -w "telemetry openapi: %{http_code}\n"
          curl --fail -u "$TEL_USUARIO:$TEL_PASSWORD" "$TEL_BASE/docs" \
            -o /dev/null -w "telemetry docs: %{http_code}\n"
          # Sin credenciales, el proxy debe rechazar con 401 (acceso externo protegido).
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" "$TEL_BASE/health")
          if [ "$CODIGO" != "401" ]; then
            echo "::error::El proveedor de telemetría debería exigir autenticación (401) y devolvió $CODIGO."
            exit 1
          fi
          echo "Backend y proveedor de telemetría operativos."
          echo "### URL del MVP (mi cuenta): $MVP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "### Swagger de telemetría: $TEL_BASE/docs" >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar logs si el despliegue falló
        if: failure()
        run: |
          for g in $(aws logs describe-log-groups \
              --query "logGroups[?contains(logGroupName,'solventa')].logGroupName" --output text); do
            echo "=== $g ==="
            aws logs tail "$g" --since 30m --format short || true
          done

      # Opcional: crear el primer usuario administrador si se definió ADMIN_PASSWORD_TELEMETRIA.
      # El contexto secrets no se puede usar en un if de paso, así que la condición se evalúa dentro
      # del bloque run mediante Bash: sin la contraseña, el paso termina bien sin hacer nada.
      - name: Crear el primer usuario administrador
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD_TELEMETRIA }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "Sin ADMIN_PASSWORD_TELEMETRIA: se omite la creación del usuario administrador."
            exit 0
          fi
          chmod +x infra/aws/crear-admin-ecs.sh
          ./infra/aws/crear-admin-ecs.sh

      - name: Limpiar archivos sensibles
        if: always()
        run: rm -rf infra/secrets
