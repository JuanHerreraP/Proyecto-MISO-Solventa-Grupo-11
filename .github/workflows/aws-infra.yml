name: AWS Infra

# Aprovisiona o elimina el MVP de Solventa en AWS
#   provisionar: ECR + imagen API + secreto JWT + secretos de la aplicación + stack
#                solventa-mvp + web + verificación
#   eliminar:    stack solventa-mvp + bucket web + bucket de PDF de pólizas + repositorio ECR
#                + secreto JWT + secretos de la aplicación
#
# Secrets requeridos del repositorio (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (y opcional AWS_SESSION_TOKEN)
#   PAGOS_WEBHOOK_SECRET  secreto compartido con la pasarela de pagos (mínimo 32 caracteres);
#                         el workflow lo copia a Secrets Manager y el stack lo inyecta en el
#                         contenedor de la API como variable de entorno PAGOS_WEBHOOK_SECRET
# Opcional (solo si se quiere crear el primer admin): ADMIN_PASSWORD
#
# Variable opcional del repositorio (pestaña Variables, no Secrets):
#   SOLVENTA_URL_PUBLICA  URL https pública de la app, sin ruta (p. ej. un dominio propio).
#                         Si no existe, el stack usa el dominio de CloudFront que crea él mismo.

on:
  # Solo manual (Actions > AWS Infra > Run workflow): se elige la acción y sus parámetros.
  workflow_dispatch:
    inputs:
      accion:
        description: "Acción a ejecutar"
        type: choice
        required: true
        default: provisionar
        options:
          - provisionar
          - eliminar
      postgres_engine_version:
        description: "Versión de PostgreSQL (solo provisionar). Vacío: la 16.x más reciente disponible"
        type: string
        default: ""
      crear_admin:
        description: "Crear usuario administrador (solo provisionar; requiere secret ADMIN_PASSWORD)"
        type: boolean
        default: false
      admin_email:
        description: "Correo del administrador"
        type: string
        default: manager@solventa.local
      admin_rol:
        description: "Rol del administrador"
        type: choice
        default: SERVICIO_INTERNO
        options:
          - SERVICIO_INTERNO
          - INGENIERO_INTEGRACIONES

concurrency:
  group: aws-infra
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  STACK: solventa-mvp
  ECR_STACK: solventa-ecr
  JWT_SECRET_NAME: solventa-mvp-jwt
  APP_SECRETS_NAME: solventa-mvp-app

jobs:
  provisionar:
    name: Provisionar infraestructura
    if: ${{ inputs.accion == 'provisionar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar credenciales
        run: aws sts get-caller-identity

      # Paso 1
      - name: Crear repositorio ECR
        run: |
          aws cloudformation deploy --stack-name "$ECR_STACK" \
            --template-file infra/aws/ecr.json --no-fail-on-empty-changeset
          BACKEND_REPO=$(aws cloudformation describe-stacks --stack-name "$ECR_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUri'].OutputValue" --output text)
          echo "BACKEND_REPO=$BACKEND_REPO" >> "$GITHUB_ENV"
          echo "REGISTRY=${BACKEND_REPO%%/*}" >> "$GITHUB_ENV"

      - name: Construir y subir la imagen de la API
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          IMAGE_TAG="$(git rev-parse --short HEAD)-$(date -u +%Y%m%d%H%M%S)"
          docker build -t "$BACKEND_REPO:$IMAGE_TAG" backend
          docker push "$BACKEND_REPO:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      # Paso 2
      - name: Crear (o reutilizar) el secreto con las llaves JWT
        run: |
          if JWT_SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$JWT_SECRET_NAME" \
              --query ARN --output text 2>/dev/null); then
            echo "El secreto $JWT_SECRET_NAME ya existe; se reutiliza."
          else
            mkdir -p infra/secrets
            chmod 700 infra/secrets
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out infra/secrets/private_key.pem
            openssl pkey -in infra/secrets/private_key.pem -pubout \
              -out infra/secrets/public_key.pem
            chmod 600 infra/secrets/*.pem
            python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('infra/secrets')
          (p / 'jwt.json').write_text(json.dumps({
              'private_key': (p / 'private_key.pem').read_text(),
              'public_key': (p / 'public_key.pem').read_text(),
          }))
          (p / 'jwt.json').chmod(0o600)
          PY
            JWT_SECRET_ARN=$(aws secretsmanager create-secret --name "$JWT_SECRET_NAME" \
              --secret-string file://infra/secrets/jwt.json --query ARN --output text)
            rm -rf infra/secrets
          fi
          echo "JWT_SECRET_ARN=$JWT_SECRET_ARN" >> "$GITHUB_ENV"

      # Paso 2b: los secretos de la aplicación salen de secrets de GitHub. El contenedor no
      # puede leer GitHub, así que se copian a Secrets Manager y el stack los inyecta.
      - name: Guardar los secretos de la aplicación en Secrets Manager
        env:
          PAGOS_WEBHOOK_SECRET: ${{ secrets.PAGOS_WEBHOOK_SECRET }}
          # HU05, opcionales: sin ellos el push queda simulado y el job de avisos apagado.
          FCM_CREDENCIALES_JSON: ${{ secrets.FCM_CREDENCIALES_JSON }}
          NOTIFICACIONES_CLAVE_INTERNA: ${{ secrets.NOTIFICACIONES_CLAVE_INTERNA }}
          # HU20 telemetría: credencial de servicio del proveedor y contraseña HTTP Basic del
          # proxy. Opcionales: si no vienen de GitHub ni existen ya, se generan aleatorias.
          SOLVENTA_TELEMETRY_API_KEY: ${{ secrets.SOLVENTA_TELEMETRY_API_KEY }}
          TELEMETRY_MOCK_PASSWORD: ${{ secrets.TELEMETRY_MOCK_PASSWORD }}
        run: |
          if [ -z "$PAGOS_WEBHOOK_SECRET" ]; then
            echo "::error::Falta el secret de GitHub PAGOS_WEBHOOK_SECRET (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${#PAGOS_WEBHOOK_SECRET}" -lt 32 ]; then
            echo "::error::PAGOS_WEBHOOK_SECRET debe tener al menos 32 caracteres."
            exit 1
          fi
          if [ -n "$FCM_CREDENCIALES_JSON" ] && \
              ! printf '%s' "$FCM_CREDENCIALES_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            echo "::error::FCM_CREDENCIALES_JSON debe ser el JSON de la cuenta de servicio de Firebase."
            exit 1
          fi
          if [ -n "$NOTIFICACIONES_CLAVE_INTERNA" ] && [ "${#NOTIFICACIONES_CLAVE_INTERNA}" -lt 32 ]; then
            echo "::error::NOTIFICACIONES_CLAVE_INTERNA debe tener al menos 32 caracteres."
            exit 1
          fi
          mkdir -p infra/secrets
          chmod 700 infra/secrets
          # Se parte del secreto actual (si existe) para conservar lo que ya tenga: las claves de
          # telemetría se generan una sola vez y no deben cambiar entre despliegues.
          if EXISTENTE=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRETS_NAME" \
              --query SecretString --output text 2>/dev/null); then
            printf '%s' "$EXISTENTE" > infra/secrets/app.actual.json
          else
            echo '{}' > infra/secrets/app.actual.json
          fi
          chmod 600 infra/secrets/app.actual.json
          python3 - <<'PY'
          import json, os, secrets
          from pathlib import Path

          actual = json.loads(Path('infra/secrets/app.actual.json').read_text() or '{}')

          def resolver(clave, valor_github, generar=False):
              """GitHub manda; si no, se conserva lo existente; si no, se genera (opcional)."""
              desde_github = (valor_github or '').strip()
              if desde_github:
                  return desde_github
              existente = (actual.get(clave) or '').strip()
              if existente:
                  return existente
              return secrets.token_urlsafe(32) if generar else ''

          datos = dict(actual)
          datos.update({
              'pagos_webhook_secret': os.environ['PAGOS_WEBHOOK_SECRET'],
              # Siempre presentes: ECS falla al iniciar si el secreto no trae la clave. Vacío = apagado.
              'fcm_credenciales_json': os.environ.get('FCM_CREDENCIALES_JSON', ''),
              'notificaciones_clave_interna': os.environ.get('NOTIFICACIONES_CLAVE_INTERNA', ''),
              # HU20: credencial de servicio y contraseña Basic. Se generan si no existen todavía.
              'solventa_telemetry_api_key': resolver(
                  'solventa_telemetry_api_key',
                  os.environ.get('SOLVENTA_TELEMETRY_API_KEY'),
                  generar=True,
              ),
              'telemetry_mock_password': resolver(
                  'telemetry_mock_password',
                  os.environ.get('TELEMETRY_MOCK_PASSWORD'),
                  generar=True,
              ),
          })
          p = Path('infra/secrets/app.json')
          p.write_text(json.dumps(datos))
          p.chmod(0o600)
          PY
          rm -f infra/secrets/app.actual.json
          SECRETO_CAMBIO=false
          if APP_SECRETS_ARN=$(aws secretsmanager describe-secret --secret-id "$APP_SECRETS_NAME" \
              --query ARN --output text 2>/dev/null); then
            ACTUAL=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRETS_NAME" \
              --query SecretString --output text 2>/dev/null || echo "")
            if [ "$ACTUAL" = "$(cat infra/secrets/app.json)" ]; then
              echo "El secreto $APP_SECRETS_NAME ya está al día."
            else
              aws secretsmanager put-secret-value --secret-id "$APP_SECRETS_NAME" \
                --secret-string file://infra/secrets/app.json >/dev/null
              SECRETO_CAMBIO=true
              echo "El secreto $APP_SECRETS_NAME cambió; se reiniciará el servicio."
            fi
          else
            APP_SECRETS_ARN=$(aws secretsmanager create-secret --name "$APP_SECRETS_NAME" \
              --secret-string file://infra/secrets/app.json --query ARN --output text)
            echo "Secreto $APP_SECRETS_NAME creado."
          fi
          echo "APP_SECRETS_ARN=$APP_SECRETS_ARN" >> "$GITHUB_ENV"
          echo "SECRETO_CAMBIO=$SECRETO_CAMBIO" >> "$GITHUB_ENV"

      # Paso 3
      - name: Generar parámetros de CloudFormation
        env:
          POSTGRES_ENGINE_VERSION: ${{ inputs.postgres_engine_version }}
          PUBLIC_URL: ${{ vars.SOLVENTA_URL_PUBLICA }}
          NOTIFICACIONES_CLAVE_INTERNA: ${{ secrets.NOTIFICACIONES_CLAVE_INTERNA }}
        run: |
          PUBLIC_URL="$(printf '%s' "$PUBLIC_URL" | tr -d '[:space:]')"
          export PUBLIC_URL
          if [ -n "$PUBLIC_URL" ] && ! printf '%s' "$PUBLIC_URL" | grep -Eq '^https://[^/]+/?$'; then
            echo "::error::La variable SOLVENTA_URL_PUBLICA debe ser una URL https sin ruta (por ejemplo https://app.ejemplo.com)."
            exit 1
          fi
          # RDS retira versiones menores con el tiempo (la 16.9 ya no existe): se consulta qué hay y,
          # sin versión indicada, se usa la 16.x más reciente. Falla aquí y no 40 minutos después.
          DISPONIBLES=$(aws rds describe-orderable-db-instance-options --engine postgres \
            --db-instance-class db.t3.micro \
            --query 'OrderableDBInstanceOptions[].EngineVersion' --output text \
            | tr '\t' '\n' | sort -uV)
          echo "Versiones de PostgreSQL disponibles para db.t3.micro:" $DISPONIBLES
          if [ -z "$POSTGRES_ENGINE_VERSION" ]; then
            POSTGRES_ENGINE_VERSION=$(printf '%s\n' "$DISPONIBLES" | grep -E '^16\.' | tail -1)
            echo "Sin versión indicada: se usa la 16.x más reciente ($POSTGRES_ENGINE_VERSION)."
          fi
          if ! printf '%s\n' "$DISPONIBLES" | grep -Fxq "$POSTGRES_ENGINE_VERSION"; then
            echo "::error::La versión de PostgreSQL '$POSTGRES_ENGINE_VERSION' no está disponible para db.t3.micro en esta región."
            exit 1
          fi
          export POSTGRES_ENGINE_VERSION
          mkdir -p infra/secrets
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          values = {
              'BackendImage': os.environ['BACKEND_REPO'] + ':' + os.environ['IMAGE_TAG'],
              'JwtSecretArn': os.environ['JWT_SECRET_ARN'],
              'AppSecretsArn': os.environ['APP_SECRETS_ARN'],
              'PostgresEngineVersion': os.environ['POSTGRES_ENGINE_VERSION'],
          }
          # Opcional: sin variable, el stack usa el dominio de CloudFront.
          if os.environ.get('PUBLIC_URL'):
              values['PublicUrl'] = os.environ['PUBLIC_URL'].rstrip('/')
          # HU05: el job diario de avisos solo se programa si hay clave interna con la que llamarlo.
          if os.environ.get('NOTIFICACIONES_CLAVE_INTERNA'):
              values['AvisosVencimientoActivos'] = 'true'
          p = Path('infra/secrets/parameters.json')
          p.write_text(json.dumps([{'ParameterKey': k, 'ParameterValue': v} for k, v in values.items()]))
          p.chmod(0o600)
          PY

      - name: Limpiar stack en ROLLBACK_COMPLETE (si existe)
        run: |
          STATUS=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo NONE)
          echo "Estado actual: $STATUS"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ]; then
            aws cloudformation delete-stack --stack-name "$STACK"
            aws cloudformation wait stack-delete-complete --stack-name "$STACK"
          fi

      - name: Validar y desplegar el stack
        run: |
          # CloudFormation acepta como máximo 51.200 bytes si la plantilla va en la solicitud
          # (todavía no hay un bucket donde subirla). Minificada ocupa casi la mitad.
          mkdir -p infra/secrets
          python3 -c "import json; json.dump(json.load(open('infra/aws/stack.json')), open('infra/secrets/stack.min.json', 'w'), separators=(',', ':'))"
          TAMANO=$(wc -c < infra/secrets/stack.min.json)
          echo "Plantilla minificada: $TAMANO bytes (máximo 51200)."
          if [ "$TAMANO" -gt 51200 ]; then
            echo "::error::La plantilla supera el máximo de 51200 bytes; hay que subirla a S3 o dividir el stack."
            exit 1
          fi
          aws cloudformation validate-template --template-body "file://infra/secrets/stack.min.json" >/dev/null
          aws cloudformation deploy --stack-name "$STACK" \
            --template-file infra/secrets/stack.min.json \
            --parameter-overrides file://infra/secrets/parameters.json \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset
          aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs" --output table

      # Si el despliegue falla, el log solo dice "Failed to create/update the stack". Esto imprime qué
      # recurso falló y por qué, para no tener que ir a la consola de CloudFormation.
      - name: Mostrar por qué falló el stack
        if: ${{ failure() }}
        run: |
          aws cloudformation describe-stack-events --stack-name "$STACK" \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceType,ResourceStatusReason]" \
            --output table || true

      # ECS lee los secretos solo al iniciar cada tarea: si el valor cambió y el stack no, las
      # tareas en ejecución seguirían con el valor anterior hasta reiniciarse.
      - name: Reiniciar los servicios para tomar el secreto nuevo
        if: ${{ env.SECRETO_CAMBIO == 'true' }}
        run: |
          CLUSTER=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='Cluster'].OutputValue" --output text)
          # La API y los dos workers (telemetría y pagos) leen los secretos al iniciar.
          SERVICIOS=""
          for SALIDA in Service WorkerService PagosWorkerService; do
            NOMBRE=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$SALIDA'].OutputValue" --output text)
            if [ -z "$NOMBRE" ] || [ "$NOMBRE" = "None" ]; then continue; fi
            aws ecs update-service --cluster "$CLUSTER" --service "$NOMBRE" \
              --force-new-deployment >/dev/null
            SERVICIOS="$SERVICIOS $NOMBRE"
          done
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICIOS

      # Patrón de mensajería: el tópico debe repartir a la cola de pagos y su worker debe estar vivo.
      - name: Verificar la mensajería de pagos
        run: |
          SALIDAS() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          TOPICO=$(SALIDAS EventosTopicArn)
          SUSCRIPCIONES=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPICO" \
            --query "length(Subscriptions[?Protocol=='sqs' && SubscriptionArn!='PendingConfirmation'])" \
            --output text)
          if [ "$SUSCRIPCIONES" != "1" ]; then
            echo "::error::El tópico $TOPICO debería tener 1 suscripción confirmada a la cola de pagos y tiene $SUSCRIPCIONES."
            exit 1
          fi
          echo "El tópico de eventos reparte a la cola de pagos."
          CLUSTER=$(SALIDAS Cluster)
          PAGOS=$(SALIDAS PagosWorkerService)
          EN_EJECUCION=$(aws ecs describe-services --cluster "$CLUSTER" --services "$PAGOS" \
            --query "services[0].runningCount" --output text)
          echo "Worker de pagos: $EN_EJECUCION tarea(s) en ejecución."
          if [ "$EN_EJECUCION" = "0" ]; then
            echo "::warning::El worker de pagos no tiene tareas en ejecución: los pagos paramétricos se acumularán en la cola."
          fi

      # Patrones de caché (Redis) y de disponibilidad (Multi-AZ y autoescalado).
      - name: Verificar la caché y la alta disponibilidad
        run: |
          SALIDAS() {
            aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          GRUPO=$(aws cloudformation describe-stack-resource --stack-name "$STACK" \
            --logical-resource-id Cache --query "StackResourceDetail.PhysicalResourceId" --output text)
          ESTADO=$(aws elasticache describe-replication-groups --replication-group-id "$GRUPO" \
            --query "ReplicationGroups[0].[Status,AutomaticFailover,MultiAZ,length(MemberClusters)]" \
            --output text)
          echo "Redis $GRUPO: $ESTADO"
          if [ "$ESTADO" != "$(printf 'available\tenabled\tenabled\t2')" ]; then
            echo "::error::Redis debería estar disponible, con failover automático, Multi-AZ y 2 nodos."
            exit 1
          fi
          BASE=$(aws cloudformation describe-stack-resource --stack-name "$STACK" \
            --logical-resource-id Database --query "StackResourceDetail.PhysicalResourceId" --output text)
          MULTI_AZ=$(aws rds describe-db-instances --db-instance-identifier "$BASE" \
            --query "DBInstances[0].MultiAZ" --output text)
          if [ "$MULTI_AZ" != "True" ]; then
            echo "::error::La base $BASE debería ser Multi-AZ y no lo es."
            exit 1
          fi
          echo "La base es Multi-AZ."
          CLUSTER=$(SALIDAS Cluster)
          API=$(SALIDAS Service)
          EN_EJECUCION=$(aws ecs describe-services --cluster "$CLUSTER" --services "$API" \
            --query "services[0].runningCount" --output text)
          echo "Backend: $EN_EJECUCION tarea(s) en ejecución."
          if [ "$EN_EJECUCION" -lt 2 ]; then
            echo "::warning::El backend tiene menos de 2 tareas: no hay redundancia ante la caída de una."
          fi
          OBJETIVOS=$(aws application-autoscaling describe-scalable-targets --service-namespace ecs \
            --resource-ids "service/$CLUSTER/$API" --query "length(ScalableTargets)" --output text)
          if [ "$OBJETIVOS" != "1" ]; then
            echo "::error::El backend debería tener un objetivo de autoescalado registrado."
            exit 1
          fi
          echo "Autoescalado del backend registrado."

      - name: Mostrar logs si el despliegue falló
        if: failure()
        run: |
          for g in $(aws logs describe-log-groups \
              --query "logGroups[?contains(logGroupName,'solventa')].logGroupName" --output text); do
            echo "=== $g ==="
            aws logs tail "$g" --since 30m --format short || true
          done

      # Paso 4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compilar y publicar la web
        run: |
          WEB_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucket'].OutputValue" --output text)
          (cd web && npm ci && VITE_API_URL="" npm run build)
          aws s3 sync web/dist/ "s3://$WEB_BUCKET/" --cache-control no-cache

      # Paso 5
      - name: Verificar
        run: |
          MVP_URL=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='Url'].OutputValue" --output text)
          MVP_URL="${MVP_URL%/}"
          echo "MVP_URL=$MVP_URL"
          # Backend principal.
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors "$MVP_URL/salud"
          curl --fail "$MVP_URL/openapi.json" -o /dev/null -w "backend openapi: %{http_code}\n"
          # Proveedor de telemetría (HU20) tras el proxy. La contraseña Basic sale de Secrets Manager.
          TEL_USUARIO=telemetry
          TEL_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$APP_SECRETS_NAME" \
            --query SecretString --output text | python3 -c 'import json,sys;print(json.load(sys.stdin).get("telemetry_mock_password",""))')
          TEL_BASE="$MVP_URL/api/telemetry"
          curl --fail --retry 10 --retry-delay 15 --retry-all-errors \
            -u "$TEL_USUARIO:$TEL_PASSWORD" "$TEL_BASE/health" -o /dev/null -w "telemetry health: %{http_code}\n"
          curl --fail -u "$TEL_USUARIO:$TEL_PASSWORD" "$TEL_BASE/openapi.json" \
            -o /dev/null -w "telemetry openapi: %{http_code}\n"
          curl --fail -u "$TEL_USUARIO:$TEL_PASSWORD" "$TEL_BASE/docs" \
            -o /dev/null -w "telemetry docs: %{http_code}\n"
          # Sin credenciales, el proxy debe rechazar con 401 (acceso externo protegido).
          CODIGO=$(curl -s -o /dev/null -w "%{http_code}" "$TEL_BASE/health")
          if [ "$CODIGO" != "401" ]; then
            echo "::error::El proveedor de telemetría debería exigir autenticación (401) y devolvió $CODIGO."
            exit 1
          fi
          echo "Proveedor de telemetría protegido y operativo."
          echo "### URL del MVP: $MVP_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "### Swagger de telemetría: $TEL_BASE/docs" >> "$GITHUB_STEP_SUMMARY"

      # Paso 6
      - name: Crear el primer usuario administrador
        if: ${{ inputs.crear_admin }}
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_ROL: ${{ inputs.admin_rol }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_PASSWORD" ]; then
            echo "Falta el secret ADMIN_PASSWORD"; exit 1
          fi
          chmod +x infra/aws/crear-admin-ecs.sh
          ./infra/aws/crear-admin-ecs.sh

      - name: Limpiar archivos sensibles
        if: always()
        run: rm -rf infra/secrets

  eliminar:
    name: Eliminar infraestructura
    if: ${{ inputs.accion == 'eliminar' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verificar credenciales
        run: aws sts get-caller-identity

      # Los recursos con política Retain se descubren antes de borrar el stack.
      - name: Descubrir recursos retenidos
        run: |
          WEB_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='WebBucket'].OutputValue" --output text 2>/dev/null || true)
          [ "$WEB_BUCKET" = "None" ] && WEB_BUCKET=""
          echo "WEB_BUCKET=$WEB_BUCKET" >> "$GITHUB_ENV"
          POLIZAS_BUCKET=$(aws cloudformation describe-stacks --stack-name "$STACK"             --query "Stacks[0].Outputs[?OutputKey=='PolizasBucket'].OutputValue" --output text 2>/dev/null || true)
          [ "$POLIZAS_BUCKET" = "None" ] && POLIZAS_BUCKET=""
          echo "POLIZAS_BUCKET=$POLIZAS_BUCKET" >> "$GITHUB_ENV"
          BACKEND_REPO=$(aws cloudformation describe-stacks --stack-name "$ECR_STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='BackendUri'].OutputValue" --output text 2>/dev/null || true)
          [ "$BACKEND_REPO" = "None" ] && BACKEND_REPO=""
          echo "ECR_REPO_NAME=${BACKEND_REPO#*/}" >> "$GITHUB_ENV"
          # La mensajería (tópico SNS y colas SQS) se borra con el stack; se anota su identidad
          # ahora porque después de borrarlo ya no se puede consultar.
          for PAR in EventosTopicArn:TOPIC_ARN PagosQueueUrl:PAGOS_QUEUE_URL \
              PagosDlqUrl:PAGOS_DLQ_URL QueueUrl:TELEMETRIA_QUEUE_URL DlqUrl:TELEMETRIA_DLQ_URL \
              AlertasTopicArn:ALERTAS_TOPIC_ARN; do
            SALIDA="${PAR%%:*}"
            VARIABLE="${PAR##*:}"
            VALOR=$(aws cloudformation describe-stacks --stack-name "$STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$SALIDA'].OutputValue" --output text 2>/dev/null || true)
            if [ "$VALOR" = "None" ]; then VALOR=""; fi
            echo "$VARIABLE=$VALOR" >> "$GITHUB_ENV"
          done
          # La caché Redis y la base Multi-AZ también se borran con el stack; se anota su
          # identificador para comprobar después que no quedó nada facturando.
          for PAR in Cache:CACHE_GRUPO Database:BASE_ID; do
            RECURSO="${PAR%%:*}"
            VARIABLE="${PAR##*:}"
            VALOR=$(aws cloudformation describe-stack-resource --stack-name "$STACK" \
              --logical-resource-id "$RECURSO" \
              --query "StackResourceDetail.PhysicalResourceId" --output text 2>/dev/null || true)
            if [ "$VALOR" = "None" ]; then VALOR=""; fi
            echo "$VARIABLE=$VALOR" >> "$GITHUB_ENV"
          done

      - name: Eliminar stack solventa-mvp
        run: |
          aws cloudformation delete-stack --stack-name "$STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$STACK"

      # Si el borrado del stack se interrumpió, o alguien recreó estos recursos a mano, la
      # mensajería puede quedar viva (y facturando). Se comprueba y, si existe, se elimina.
      - name: Comprobar que la mensajería, la caché y las alarmas quedaron eliminadas
        run: |
          if [ -n "$ALERTAS_TOPIC_ARN" ] && aws sns get-topic-attributes --topic-arn "$ALERTAS_TOPIC_ARN" >/dev/null 2>&1; then
            echo "El tópico de alertas $ALERTAS_TOPIC_ARN sigue existiendo; se elimina."
            aws sns delete-topic --topic-arn "$ALERTAS_TOPIC_ARN"
          fi
          if [ -n "$CACHE_GRUPO" ] && aws elasticache describe-replication-groups \
              --replication-group-id "$CACHE_GRUPO" >/dev/null 2>&1; then
            echo "La caché $CACHE_GRUPO sigue existiendo; se elimina."
            aws elasticache delete-replication-group --replication-group-id "$CACHE_GRUPO" \
              --no-retain-primary-cluster || true
            aws elasticache wait replication-group-deleted --replication-group-id "$CACHE_GRUPO" || true
          fi
          if [ -n "$BASE_ID" ] && aws rds describe-db-instances --db-instance-identifier "$BASE_ID" >/dev/null 2>&1; then
            echo "La base $BASE_ID sigue existiendo; se elimina."
            aws rds delete-db-instance --db-instance-identifier "$BASE_ID" \
              --skip-final-snapshot --delete-automated-backups || true
            aws rds wait db-instance-deleted --db-instance-identifier "$BASE_ID" || true
          fi
          if [ -n "$TOPIC_ARN" ] && aws sns get-topic-attributes --topic-arn "$TOPIC_ARN" >/dev/null 2>&1; then
            echo "El tópico $TOPIC_ARN sigue existiendo; se elimina."
            aws sns delete-topic --topic-arn "$TOPIC_ARN"
          fi
          for COLA in "$PAGOS_QUEUE_URL" "$PAGOS_DLQ_URL" "$TELEMETRIA_QUEUE_URL" "$TELEMETRIA_DLQ_URL"; do
            if [ -z "$COLA" ]; then continue; fi
            if aws sqs get-queue-attributes --queue-url "$COLA" --attribute-names QueueArn >/dev/null 2>&1; then
              echo "La cola $COLA sigue existiendo; se elimina."
              aws sqs delete-queue --queue-url "$COLA"
            fi
          done
          # Todas las alarmas del stack (cola de fallidos, salud del backend, atraso del worker)
          # y las que crea el autoescalado del backend (`TargetTracking-service/<cluster>/...`).
          ALARMAS=$(aws cloudwatch describe-alarms --alarm-name-prefix "${STACK}-" \
            --query "MetricAlarms[].AlarmName" --output text)
          ALARMAS="$ALARMAS $(aws cloudwatch describe-alarms --alarm-name-prefix "TargetTracking-service/${STACK}-" \
            --query "MetricAlarms[].AlarmName" --output text)"
          ALARMAS=$(echo $ALARMAS)
          if [ -n "$ALARMAS" ]; then
            echo "Alarma(s) sin eliminar: $ALARMAS; se eliminan."
            aws cloudwatch delete-alarms --alarm-names $ALARMAS
          fi
          echo "Mensajería, caché y alarmas eliminadas."

      # Ambos buckets son versionados y de política Retain: hay que borrar todas las
      # versiones y los marcadores de eliminación antes de poder eliminar el bucket.
      - name: Vaciar y eliminar los buckets retenidos (web y PDF de pólizas)
        run: |
          vaciar_y_eliminar() {
            BUCKET="$1"
            if [ -z "$BUCKET" ] || ! aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
              echo "Sin bucket que eliminar ($2)."; return 0
            fi
            while true; do
              OBJS=$(aws s3api list-object-versions --bucket "$BUCKET" --max-items 1000                 --query '{Objects: [].{Key: Key, VersionId: VersionId}}' --output json 2>/dev/null                 | jq -c 'select(.Objects != null) | {Objects: [.Objects[] | select(.Key != null)], Quiet: true}')
              if [ -z "$OBJS" ] || [ "$(echo "$OBJS" | jq '.Objects | length')" = "0" ]; then break; fi
              aws s3api delete-objects --bucket "$BUCKET" --delete "$OBJS" >/dev/null
            done
            aws s3api delete-bucket --bucket "$BUCKET"
            echo "Bucket $2 eliminado: $BUCKET"
          }
          vaciar_y_eliminar "$WEB_BUCKET" "web"
          vaciar_y_eliminar "$POLIZAS_BUCKET" "de PDF de pólizas"

      - name: Eliminar repositorio ECR
        run: |
          aws cloudformation delete-stack --stack-name "$ECR_STACK"
          aws cloudformation wait stack-delete-complete --stack-name "$ECR_STACK"
          if [ -n "$ECR_REPO_NAME" ]; then
            aws ecr delete-repository --repository-name "$ECR_REPO_NAME" --force 2>/dev/null \
              || echo "Repositorio ECR ya eliminado."
          fi

      - name: Eliminar secreto JWT
        run: |
          aws secretsmanager delete-secret --secret-id "$JWT_SECRET_NAME" \
            --force-delete-without-recovery 2>/dev/null \
            || echo "Secreto JWT ya eliminado."

      - name: Eliminar secretos de la aplicación
        run: |
          aws secretsmanager delete-secret --secret-id "$APP_SECRETS_NAME" \
            --force-delete-without-recovery 2>/dev/null \
            || echo "Secretos de la aplicación ya eliminados."
