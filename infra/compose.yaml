name: solventa

x-backend: &backend
  image: solventa-backend:${IMAGE_TAG:-local}
  build:
    context: ../backend
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: solventa
      POSTGRES_USER: solventa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U solventa -d solventa"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://solventa:${POSTGRES_PASSWORD}@postgres:5432/solventa
      WEB_ALLOWED_ORIGINS: https://${SITE_ADDRESS:?Definir SITE_ADDRESS}
      WEB_COOKIE_SECURE: "true"
      WEB_COOKIE_SAMESITE: lax
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      KYC_PROVIDER: A
      KYC_PROVIDER_A_URL: http://kyc-a:8000
      KYC_PROVIDER_B_URL: http://kyc-b:8000
      KYC_PROVIDER_C_URL: http://kyc-c:8000
    secrets:
      - jwt_private_key
      - jwt_public_key
    depends_on:
      postgres:
        condition: service_healthy
      kyc-a:
        condition: service_healthy
      kyc-b:
        condition: service_healthy
      kyc-c:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  kyc-a:
    <<: *backend
    command: [uvicorn, mocks.kyc.provider_a:app, --host, 0.0.0.0, --port, "8000"]
    healthcheck: &kyc-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  kyc-b:
    <<: *backend
    command: [uvicorn, mocks.kyc.provider_b:app, --host, 0.0.0.0, --port, "8000"]
    healthcheck: *kyc-health

  kyc-c:
    <<: *backend
    command: [uvicorn, mocks.kyc.provider_c:app, --host, 0.0.0.0, --port, "8000"]
    healthcheck: *kyc-health

  web:
    image: solventa-web:${IMAGE_TAG:-local}
    build:
      context: ../web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

secrets:
  jwt_private_key:
    file: ${JWT_PRIVATE_KEY_FILE:?Definir JWT_PRIVATE_KEY_FILE}
  jwt_public_key:
    file: ${JWT_PUBLIC_KEY_FILE:?Definir JWT_PUBLIC_KEY_FILE}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
